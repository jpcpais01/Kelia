<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelia</title>
    <meta name="description" content="Kelia — a hand-crafted fantasy MMORPG that runs in your browser." />
    <meta name="theme-color" content="#0d0f14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Kelia" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kelia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-bg" id="boot-bg" aria-hidden="true"></div>
      <div class="boot-mark">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path d="M32 4 L38 26 L60 32 L38 38 L32 60 L26 38 L4 32 L26 26 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="32" cy="32" r="5" fill="currentColor"/></svg>
      </div>
      <div class="boot-title">KELIA</div>
      <div class="boot-bar"><i id="boot-progress"></i></div>
      <div class="boot-status" id="boot-status">Preparing the world…</div>
    </div>
    <script>
      // Loading backdrop: hero shots of the valley brought to life (drifting clouds, rippling
      // water, swaying grass) by a small shader in a worker, so it stays smooth while the world
      // loads. Runs before the game bundle so it shows at once. Falls back to still pictures
      // with a slow pan where that is not available.
      (function () {
        var B = '/assets/backdrops/';
        var scenes = [
          { base: B + 'lake-sunset', wind: 1 },
          { base: B + 'village', wind: 1 },
          { base: B + 'lake-dawn', wind: -1 },
          { base: B + 'falls', wind: 1, fall: [0.37, 0.38, 0.555, 0.8] },
          { base: B + 'meadow', wind: 1 },
          { base: B + 'vista', wind: -1 },
          { base: B + 'shrine', wind: 1 },
          { base: B + 'peaks', wind: -1 },
        ];
        var host = document.getElementById('boot-bg');
        if (!host) return;
        var start = Math.floor(Math.random() * scenes.length);
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

        function slideshow() {
          var n = 0;
          (function show() {
            if (!host.isConnected) return;
            var img = new Image();
            img.decoding = 'async';
            img.alt = '';
            img.className = 'pan-' + (n % 4);
            if (n === 0) img.fetchPriority = 'high';
            img.onload = function () {
              host.appendChild(img);
              requestAnimationFrame(function () { img.classList.add('on'); });
              // drop layers that are fully covered by the new one
              setTimeout(function () { while (host.children.length > 1) host.removeChild(host.firstChild); }, 2600);
              n++;
              setTimeout(show, 8000);
            };
            img.src = scenes[(start + n) % scenes.length].base + '.webp';
          })();
        }

        var cv = document.createElement('canvas');
        if (still || !cv.transferControlToOffscreen || typeof Worker === 'undefined') return slideshow();
        var worker;
        try {
          worker = new Worker('/boot/backdrop-worker.js');
          var off = cv.transferControlToOffscreen();
          host.appendChild(cv);
          // the pictures are 1080p, so never draw more pixels than that needs
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(2.2e6 / (innerWidth * innerHeight)));
          worker.postMessage({ type: 'init', canvas: off, w: innerWidth, h: innerHeight, dpr: dpr, scenes: scenes, start: start }, [off]);
        } catch (e) {
          if (cv.parentNode) cv.remove();
          return slideshow();
        }
        var done = false;
        var fallback = function () {
          if (done) return;
          done = true;
          worker.terminate();
          cv.remove();
          slideshow();
        };
        worker.onerror = fallback;
        worker.onmessage = function (e) {
          if (e.data.type === 'ready') { done = true; cv.classList.add('on'); }
          else if (e.data.type === 'fail') fallback();
        };
        // nothing on screen after a few seconds: show the stills instead
        setTimeout(function () { if (!done) fallback(); }, 6000);
        addEventListener('resize', function () { worker.postMessage({ type: 'size', w: innerWidth, h: innerHeight }); });
        // the boot screen is removed once the world is in: stop drawing and free the GPU
        new MutationObserver(function (_, obs) {
          if (host.isConnected) return;
          obs.disconnect();
          worker.postMessage({ type: 'stop' });
        }).observe(document.body, { childList: true });
      })();
    </script>
    <noscript>Kelia needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
